<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f141a">
  <title>Live Weather Search</title>
  <style>
    :root { color-scheme: dark; --bg:#0f141a; --panel:#171c22; --panel2:#202832; --line:#343e49; --text:#e5edf5; --muted:#9baaba; --accent:#abcae8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% -20%,#263849 0,transparent 55%),var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
    main { width:min(940px,calc(100% - 32px)); margin:0 auto; padding:56px 0 40px; }
    .eyebrow { color:var(--accent); font:600 12px/1.4 ui-monospace,SFMono-Regular,monospace; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:8px 0 8px; font-size:clamp(32px,6vw,52px); letter-spacing:-.045em; }
    .intro { color:var(--muted); margin:0 0 26px; }
    form { display:flex; gap:10px; padding:8px; background:var(--panel); border:1px solid var(--line); }
    input { flex:1; min-width:0; border:0; outline:0; padding:12px; color:var(--text); background:transparent; font:inherit; }
    input:focus-visible { box-shadow:inset 0 0 0 1px var(--accent); }
    button { border:0; padding:0 20px; background:var(--accent); color:#10202e; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #status { min-height:28px; padding:8px 2px; color:var(--muted); }
    #status.error { color:#ffb4ab; }
    #weather[hidden] { display:none; }
    .location { display:flex; flex-wrap:wrap; align-items:baseline; gap:12px; margin:18px 0 14px; }
    .location h2 { margin:0; font-size:24px; }
    .location span { color:var(--muted); font:12px ui-monospace,SFMono-Regular,monospace; }
    .current { display:grid; grid-template-columns:1.2fr 1fr; gap:14px; }
    .card { background:var(--panel); border:1px solid var(--line); padding:22px; }
    .temp { color:var(--accent); font-size:clamp(58px,12vw,100px); font-weight:500; line-height:1; letter-spacing:-.06em; }
    .summary { margin-top:12px; color:var(--muted); }
    .metrics { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .metric { padding:14px; background:var(--panel2); }
    .metric label { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .metric strong { display:block; margin-top:5px; font-size:22px; }
    h3 { margin:28px 0 10px; font:600 13px ui-monospace,SFMono-Regular,monospace; letter-spacing:.1em; text-transform:uppercase; }
    .hours { display:grid; grid-template-columns:repeat(8,minmax(90px,1fr)); gap:8px; overflow-x:auto; padding-bottom:6px; }
    .hour { padding:14px 10px; background:var(--panel); border:1px solid var(--line); text-align:center; }
    .hour time { display:block; color:var(--muted); font-size:12px; }
    .hour strong { display:block; margin:10px 0 4px; font-size:20px; }
    .hour small { color:var(--muted); }
    footer { margin-top:32px; color:var(--muted); font-size:12px; }
    footer a { color:var(--accent); }
    @media(max-width:620px) { main { padding-top:34px; } .current { grid-template-columns:1fr; } .hours { grid-template-columns:repeat(8,100px); } form button { padding:0 14px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Atmos // Live weather</div>
    <h1>Weather, right now.</h1>
    <p class="intro">Search for a city to see current conditions and the next hours, powered by Open-Meteo.</p>
    <form id="searchForm" role="search">
      <input id="cityInput" type="search" placeholder="Search a city (e.g. Berlin)" aria-label="City name" required autocomplete="off">
      <button id="searchButton" type="submit">Search</button>
    </form>
    <div id="status" role="status" aria-live="polite">Search for a city to load its latest weather.</div>
    <section id="weather" hidden aria-live="polite">
      <div class="location"><h2 id="placeName"></h2><span id="updatedAt"></span></div>
      <div class="current">
        <div class="card"><div class="eyebrow">Current temperature</div><div class="temp"><span id="temperature">—</span><span style="font-size:.42em">°C</span></div><div class="summary" id="currentDetails"></div></div>
        <div class="card metrics">
          <div class="metric"><label>Humidity</label><strong id="humidity">—</strong></div>
          <div class="metric"><label>Wind speed</label><strong id="wind">—</strong></div>
          <div class="metric"><label>Local time</label><strong id="localTime">—</strong></div>
          <div class="metric"><label>Coordinates</label><strong id="coordinates" style="font-size:15px">—</strong></div>
        </div>
      </div>
      <h3>Next hours</h3>
      <div class="hours" id="hourly"></div>
    </section>
    <footer>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a>. Data refreshes automatically every 10 minutes.</footer>
  </main>
  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('cityInput');
    const button = document.getElementById('searchButton');
    const status = document.getElementById('status');
    const weather = document.getElementById('weather');
    let selectedPlace = null;
    let refreshTimer;
    let requestId = 0;

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }
    function number(value, digits = 0) {
      return Number.isFinite(value) ? Number(value).toFixed(digits) : '—';
    }
    function placeLabel(place) {
      return [place.name, place.admin1, place.country].filter((part, index, all) => part && all.indexOf(part) === index).join(', ');
    }

    async function searchCity(query) {
      const id = ++requestId;
      button.disabled = true;
      weather.hidden = true;
      setStatus('Searching for the city…');
      try {
        const geoUrl = new URL('https://geocoding-api.open-meteo.com/v1/search');
        geoUrl.search = new URLSearchParams({ name: query, count: '1', language: 'en', format: 'json' });
        const geoResponse = await fetch(geoUrl);
        if (!geoResponse.ok) throw new Error('City lookup is temporarily unavailable. Please try again.');
        const geo = await geoResponse.json();
        if (id !== requestId) return;
        if (!geo.results?.length) throw new Error(`No matching city found for “${query}”. Try another name.`);
        selectedPlace = geo.results[0];
        await loadWeather(id);
        clearInterval(refreshTimer);
        refreshTimer = setInterval(() => loadWeather(++requestId), 10 * 60 * 1000);
      } catch (error) {
        if (id === requestId) setStatus(error.message || 'Unable to load weather. Please try again.', true);
      } finally {
        if (id === requestId) button.disabled = false;
      }
    }

    async function loadWeather(id = ++requestId) {
      if (!selectedPlace) return;
      const params = new URLSearchParams({
        latitude: selectedPlace.latitude,
        longitude: selectedPlace.longitude,
        current: 'temperature_2m,relative_humidity_2m,wind_speed_10m',
        hourly: 'temperature_2m,relative_humidity_2m,wind_speed_10m',
        forecast_days: '2',
        timezone: 'auto'
      });
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
        if (!response.ok) throw new Error('Weather service is temporarily unavailable. Please try again.');
        const data = await response.json();
        if (id !== requestId) return;
        if (!data.current || !data.hourly) throw new Error('Weather data was incomplete. Please try again.');
        renderWeather(selectedPlace, data);
        setStatus('Weather is up to date.');
      } catch (error) {
        if (id === requestId) setStatus(error.message || 'Unable to load weather. Please try again.', true);
      }
    }

    function renderWeather(place, data) {
      const current = data.current;
      const units = data.current_units || {};
      document.getElementById('placeName').textContent = placeLabel(place);
      document.getElementById('updatedAt').textContent = `UPDATED ${current.time.replace('T', ' ')} ${data.timezone_abbreviation || ''}`;
      document.getElementById('temperature').textContent = number(current.temperature_2m, 1);
      document.getElementById('humidity').textContent = `${number(current.relative_humidity_2m)}${units.relative_humidity_2m || '%'}`;
      document.getElementById('wind').textContent = `${number(current.wind_speed_10m, 1)} ${units.wind_speed_10m || 'km/h'}`;
      document.getElementById('localTime').textContent = current.time.split('T')[1] || '—';
      document.getElementById('coordinates').textContent = `${number(place.latitude, 2)}, ${number(place.longitude, 2)}`;
      document.getElementById('currentDetails').textContent = `Humidity ${number(current.relative_humidity_2m)}% · Wind ${number(current.wind_speed_10m, 1)} ${units.wind_speed_10m || 'km/h'}`;
      const hourly = data.hourly;
      const currentIndex = Math.max(0, hourly.time.findIndex(time => time >= current.time));
      const cards = hourly.time.slice(currentIndex, currentIndex + 12);
      document.getElementById('hourly').replaceChildren(...cards.map((time, offset) => {
        const index = currentIndex + offset;
        const article = document.createElement('article');
        article.className = 'hour';
        const label = document.createElement('time');
        label.textContent = time.slice(11, 16);
        const temp = document.createElement('strong');
        temp.textContent = `${number(hourly.temperature_2m[index], 1)}°`;
        const detail = document.createElement('small');
        detail.textContent = `${number(hourly.relative_humidity_2m[index])}% · ${number(hourly.wind_speed_10m[index], 1)} ${units.wind_speed_10m || 'km/h'}`;
        article.append(label, temp, detail);
        return article;
      }));
      weather.hidden = false;
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const query = input.value.trim();
      if (query) searchCity(query);
    });
  </script>
</body>
</html>
